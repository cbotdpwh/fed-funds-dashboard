name: Update dashboard

on:
  schedule:
    # 22:45 UTC = 6:45 AM Philippine time (UTC+8), every day.
    # GitHub often starts scheduled jobs a few minutes late, so we start
    # 15 minutes early to have the page ready by 7:00 AM.
    - cron: "45 22 * * *"
  workflow_dispatch:   # adds a "Run workflow" button so you can refresh any time
  push:
    branches: [main]
    paths:
      - "template.html"
      - "build_dashboard.py"
      - ".github/workflows/update-dashboard.yml"

permissions:
  contents: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build dashboard from the Google Sheet
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          REGISTER_GID: ${{ vars.REGISTER_GID }}
          SOF_GID: ${{ vars.SOF_GID }}
        run: python build_dashboard.py

      - name: Save the new dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/.nojekyll
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Dashboard update $(TZ=Asia/Manila date '+%d %b %Y %H:%M') PHT"
            git push
          fi
