name: Update dashboard

on:
  schedule:
    # 22:45 UTC = 6:45 AM Philippine time (UTC+8), every day.
    # GitHub often starts scheduled jobs a few minutes late, so we start
    # 15 minutes early to have the page ready by 7:00 AM.
    - cron: "45 22 * * *"
  workflow_dispatch:   # adds a "Run workflow" button so you can refresh any time
  push:
    branches: [main]
    paths:
      - "template.html"
      - "build_dashboard.py"
      - ".github/workflows/update-dashboard.yml"

permissions:
  contents: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the repository files
        uses: actions/checkout@v5

      - name: Check the files are in the right place
        run: |
          missing=""
          for f in build_dashboard.py template.html; do
            [ -f "$f" ] || missing="$missing $f"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Files are in the wrong place::Not found at the top level of the repository:$missing. These files must sit next to the .github folder and README.md. If you uploaded the whole fed-funds-dashboard folder, open it on GitHub and move its contents up one level (or upload the files again from inside the folder)."
            echo "Files currently in the repository:"
            find . -path ./.git -prune -o -type f -print | head -40
            exit 1
          fi

      - name: Build dashboard from the Google Sheet
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          REGISTER_GID: ${{ vars.REGISTER_GID }}
          SOF_GID: ${{ vars.SOF_GID }}
        run: python3 build_dashboard.py

      - name: Save the new dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/.nojekyll
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Dashboard update $(TZ=Asia/Manila date '+%d %b %Y %H:%M') PHT"
          if ! git push; then
            echo "::error title=GitHub blocked saving the dashboard::Go to Settings > Actions > General > Workflow permissions, choose 'Read and write permissions', click Save, then run again."
            exit 1
          fi
